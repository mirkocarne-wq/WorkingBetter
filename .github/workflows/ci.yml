name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: wb, POSTGRES_PASSWORD: wb, POSTGRES_DB: workingbetter }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wb -d workingbetter"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versione letta da packageManager in package.json
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
        env:
          AUTH_MODE: dev
          AUTH_DEV_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      - name: Test API, worker e db anche contro PostgreSQL vero (un database usa-e-getta per file di test)
        run: pnpm -r --filter @wb/db --filter @wb/api --filter @wb/workers test
        env:
          AUTH_MODE: dev
          AUTH_DEV_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          TEST_DATABASE_URL: postgres://wb:wb@localhost:5432/postgres
      - name: Contratto OpenAPI e client generato allineati (ADR-0009)
        run: pnpm contract:check
      - name: Inventari di documentazione generati dal codice allineati
        run: pnpm docs:check
      - run: pnpm --filter @wb/web build
      - run: pnpm --filter @wb/console build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - run: pnpm --filter @wb/api build
      - name: Migrazioni e seed sul Postgres di CI
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgres://wb:wb@localhost:5432/workingbetter
      - name: Browser per i test end-to-end
        run: pnpm --filter @wb/web exec playwright install --with-deps chromium
      - name: Test end-to-end della web app (stack reale)
        run: pnpm --filter @wb/web e2e
        env:
          E2E_START_SERVERS: "1"
          DATABASE_URL: postgres://wb:wb@localhost:5432/workingbetter
      - name: Scansione delle rotte GET sull'API reale (nessun 5xx per admin, HR, manager, collaboratore, piattaforma)
        run: |
          (cd apps/api && DATABASE_URL=postgres://wb:wb@localhost:5432/workingbetter DB_APP_ROLE=wb_app AUTH_MODE=dev AUTH_DEV_SECRET=ci-secret-ci-secret-ci-secret-ci-secret NOTES_MASTER_KEY=$(printf 'ab%.0s' $(seq 32)) API_PORT=4000 API_CORS_ORIGIN=http://localhost:3000 API_PUBLIC_URL=http://localhost:4000 APP_BASE_URL=http://localhost:3000 node dist/main.js > /tmp/api-sweep.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health >/dev/null && break; sleep 1; done
          SWEEP_DEV_LOGIN=1 SMOKE_EMAIL=anna.colombo@acme.test SWEEP_EXTRA_EMAILS=chiara.moretti@acme.test,giulia.ferri@acme.test,luca.bianchi@acme.test PLATFORM_EMAIL=ops@workingbetter.local PLATFORM_PASSWORD='Password!2026' node scripts/api-sweep.mjs http://localhost:4000 || { tail -50 /tmp/api-sweep.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
